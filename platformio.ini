[platformio]
default_envs = nano_esp32
src_dir = src

[env:nano_esp32]
platform = espressif32
board = arduino-nano-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    nrf24/RF24 @ ^1.4.2
    me-no-dev/ESPAsyncWebServer @ ^3.0.4
    ; Future libs for V3 expansion:
    ; fastled/FastLED @ ^3.10.0
    ; adafruit/Adafruit SSD1306 @ ^2.5.10
    ; adafruit/Adafruit GFX Library @ ^1.11.9
    ; adafruit/Adafruit MPU6050 @ ^2.2.4
    ; adafruit/Adafruit Unified Sensor @ ^1.13.0

lib_ldf_mode = deep+

board_build.partitions = default_8MB.csv
